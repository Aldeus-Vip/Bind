# 手動で実行して、モデル入りの1ファイル版(bind_3d_game.html)を作る。
# 使い方: GitHub の Actions タブ → 「Build HTML (1ファイル版)」→ Run workflow
#         → 終わったら実行結果のページ下部「Artifacts」から bind_3d_game をダウンロード(zip の中に html)
name: Build HTML (1ファイル版)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node tools/build.mjs --single
      - name: ファイル名に日時を付ける
        id: name
        run: echo "stamp=$(TZ=Asia/Tokyo date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: bind_3d_game-${{ steps.name.outputs.stamp }}
          path: dist/bind_3d_game.html
          retention-days: 30
      - name: 結果の表示
        run: |
          echo "### bind_3d_game.html を作りました" >> "$GITHUB_STEP_SUMMARY"
          echo "- サイズ: $(du -h dist/bind_3d_game.html | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- このページ下部の **Artifacts** からダウンロードしてください(zip を展開すると html が入っています)" >> "$GITHUB_STEP_SUMMARY"
